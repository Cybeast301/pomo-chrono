<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomo Chrono - Retro Pomodoro Timer</title>

  <!-- Google Fonts: Press Start 2P & Silkscreen -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. Shared CSS
       ========================================================================== */
    :root {
      --bg-color: #c1121f;
      --bg-dark: #780016;
      --bg-deep: #2b0004;
      --cream-dial: #fff4da;
      --cream-input: #fffbf0;
      --cream-card: #fffbf0;
      --cream-border: #edd8b1;
      --text-white: #ffffff;
      --pixel-shadow: 4px 4px 0px #000000;
      --pixel-shadow-sm: 2px 2px 0px #000000;
      --pixel-shadow-press: 1px 1px 0px #000000;
      --font-pixel: 'Press Start 2P', monospace;
      --font-silk: 'Silkscreen', monospace;
      --leaf-green: #2b9348;
      --stem-green: #1b6631;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: var(--font-silk);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      user-select: none;
      padding: 20px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .hidden {
      display: none !important;
    }

    /* CRT Scanline & Radial Vignette Overlay */
    .crt-overlay {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, transparent 40%, rgba(30, 0, 5, 0.45) 90%),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.08) 0px, rgba(0, 0, 0, 0.08) 2px, transparent 2px, transparent 4px);
      pointer-events: none;
      z-index: 100;
    }

    /* Ambient Canvas */
    #ambient-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Screen Transitions */
    .flash-screen {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 200;
      transition: opacity 0.12s ease-out;
    }
    .flash-active {
      opacity: 0.95;
    }

    .wipe-overlay {
      position: fixed;
      inset: 0;
      background-color: #4a0008;
      transform: translateY(100%);
      z-index: 150;
      pointer-events: none;
    }
    .wipe-up {
      animation: screenWipe 0.7s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }
    @keyframes screenWipe {
      0% { transform: translateY(100%); }
      40% { transform: translateY(0%); }
      60% { transform: translateY(0%); }
      100% { transform: translateY(-100%); }
    }

    /* Mute / Unmute Button */
    .mute-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.35);
      border: 2px solid var(--text-white);
      color: var(--text-white);
      padding: 10px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 160;
      box-shadow: var(--pixel-shadow-sm);
      transition: background-color 0.2s, transform 0.05s;
    }
    .mute-btn:hover {
      background-color: var(--text-white);
      color: var(--bg-color);
    }
    .mute-btn:active {
      transform: translate(2px, 2px);
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 3px dashed #ffffff;
      outline-offset: 4px;
    }

    .screen-stage {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* ==========================================================================
       2. Screen 1 CSS (Intro)
       ========================================================================== */
    .intro-title-wrapper {
      margin-bottom: 12px;
      perspective: 600px;
    }

    h1.intro-pixel-title {
      font-family: var(--font-pixel);
      font-size: clamp(1.6rem, 5vw, 2.7rem);
      letter-spacing: 2px;
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .intro-title-letter {
      display: inline-block;
      text-shadow: var(--pixel-shadow);
      opacity: 0;
      transform: translateY(-80px) rotate(-10deg);
      animation: introDropLetter 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes introDropLetter {
      0% { opacity: 0; transform: translateY(-80px) rotate(-10deg); }
      70% { opacity: 1; transform: translateY(8px) rotate(4deg); }
      100% { opacity: 1; transform: translateY(0) rotate(0deg); }
    }

    .glitch {
      animation: introTitleGlitch 0.2s infinite !important;
    }

    @keyframes introTitleGlitch {
      0% { transform: translate(0); text-shadow: var(--pixel-shadow); }
      33% { transform: translate(-3px, 2px); text-shadow: -3px -1px #00ffff, var(--pixel-shadow); }
      66% { transform: translate(3px, -2px); text-shadow: 3px 1px #ff00ff, var(--pixel-shadow); }
      100% { transform: translate(0); text-shadow: var(--pixel-shadow); }
    }

    .intro-tagline-container {
      min-height: 28px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro-tagline-text {
      font-size: clamp(0.75rem, 2.2vw, 0.95rem);
      letter-spacing: 0.5px;
      line-height: 1.4;
      font-weight: 700;
      text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.8);
    }

    .intro-cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background-color: var(--text-white);
      margin-left: 4px;
      vertical-align: middle;
      animation: introCursorBlink 0.8s infinite steps(1);
    }

    @keyframes introCursorBlink {
      0%, 50% { opacity: 1; }
      50.1%, 100% { opacity: 0; }
    }

    .intro-tomato-stage {
      position: relative;
      width: 250px;
      height: 250px;
      margin-bottom: 32px;
      cursor: pointer;
    }

    .intro-tomato-drop-wrapper {
      width: 100%;
      height: 100%;
      transform-origin: center bottom;
      animation: introDropSquash 1.1s cubic-bezier(0.28, 0.84, 0.42, 1) forwards;
    }

    @keyframes introDropSquash {
      0% { transform: translateY(-380px) scale(0.85, 1.25); opacity: 0; }
      50% { opacity: 1; }
      65% { transform: translateY(0) scale(1.22, 0.8); }
      80% { transform: translateY(-30px) scale(0.95, 1.05); }
      92% { transform: translateY(0) scale(1.05, 0.95); }
      100% { transform: translateY(0) scale(1, 1); opacity: 1; }
    }

    .intro-floor-shadow {
      position: absolute;
      bottom: 2px;
      left: 15%;
      width: 70%;
      height: 20px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.45) 0%, transparent 72%);
      border-radius: 50%;
      transform-origin: center;
      animation: introShadowFade 1.1s cubic-bezier(0.28, 0.84, 0.42, 1) forwards;
    }

    @keyframes introShadowFade {
      0% { transform: scale(0.2); opacity: 0; }
      65% { transform: scale(1.2); opacity: 0.65; }
      80% { transform: scale(0.85); opacity: 0.3; }
      100% { transform: scale(1); opacity: 0.45; }
    }

    .intro-tomato-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(4px 6px 0px rgba(0, 0, 0, 0.35));
    }

    .intro-tick-shake {
      animation: introMechanicalTick 0.18s cubic-bezier(0.36, 0.07, 0.19, 1.35);
    }
    @keyframes introMechanicalTick {
      0% { transform: rotate(0deg); }
      40% { transform: rotate(1.4deg) translate(0.5px, -0.5px); }
      75% { transform: rotate(-0.8deg); }
      100% { transform: rotate(0deg); }
    }

    .intro-bell-wiggle {
      animation: introBellWiggle 0.4s cubic-bezier(0.36, 0.07, 0.19, 1.4);
    }
    @keyframes introBellWiggle {
      0% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.04, 0.96) rotate(-3.5deg); }
      40% { transform: scale(0.97, 1.03) rotate(3.5deg); }
      60% { transform: scale(1.02, 0.98) rotate(-2deg); }
      80% { transform: scale(0.99, 1.01) rotate(1deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .intro-manual-ding {
      animation: introManualDing 0.5s ease;
    }
    @keyframes introManualDing {
      0% { transform: scale(0.95); }
      25% { transform: scale(1.1) rotate(6deg); }
      50% { transform: scale(1.05) rotate(-6deg); }
      75% { transform: scale(1.02) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .intro-leaf-sway {
      transform-origin: 100px 32px;
      animation: introLeavesSway 4.5s ease-in-out infinite alternate;
    }
    @keyframes introLeavesSway {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(4deg); }
    }

    .intro-highlight-move {
      animation: introHighlightShift 6s ease-in-out infinite alternate;
    }
    @keyframes introHighlightShift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-4px, 3px) scale(1.04); }
    }

    .intro-fast-dial-spin {
      animation: introFastSpin 0.35s linear infinite !important;
      transform-origin: 100px 112px;
    }
    @keyframes introFastSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    .intro-btn-container {
      opacity: 0;
      transform: translateY(40px);
      animation: introSlideUpBtn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards 2.3s;
    }
    @keyframes introSlideUpBtn {
      to { opacity: 1; transform: translateY(0); }
    }

    #start-button {
      background: transparent;
      color: var(--text-white);
      font-family: var(--font-pixel);
      font-size: clamp(1rem, 3vw, 1.25rem);
      border: 4px solid var(--text-white);
      padding: 16px 44px;
      cursor: pointer;
      box-shadow: var(--pixel-shadow);
      position: relative;
      outline: none;
      transition: background-color 0.15s, color 0.15s, transform 0.08s, box-shadow 0.08s;
      animation: introBtnGlowPulse 2.4s infinite alternate ease-in-out;
    }
    @keyframes introBtnGlowPulse {
      0% { box-shadow: var(--pixel-shadow), 0 0 0px rgba(255, 255, 255, 0); }
      100% { box-shadow: var(--pixel-shadow), 0 0 18px rgba(255, 255, 255, 0.7); }
    }
    #start-button:hover {
      background-color: var(--text-white);
      color: var(--bg-color);
      animation: none;
      box-shadow: 6px 6px 0px #000000;
    }
    #start-button:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px #000000;
    }

    .intro-stage-launch {
      animation: introLaunchZoom 0.75s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }
    @keyframes introLaunchZoom {
      0% { transform: scale(1); opacity: 1; }
      35% { transform: scale(0.92); }
      100% { transform: scale(4.5); opacity: 0; filter: blur(6px); }
    }

    /* ==========================================================================
       3. Screen 2 CSS (Set Your Task)
       ========================================================================== */
    #task-screen {
      padding-top: 10px;
      padding-bottom: 30px;
    }

    #task-splash-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
    }

    .task-back-link {
      align-self: flex-start;
      color: #fffb8f;
      text-decoration: none;
      font-size: 0.75rem;
      margin-bottom: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .task-back-link:hover {
      text-decoration: underline;
    }

    .task-tomato-row {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
      min-height: 52px;
    }

    .task-mini-tomato {
      width: 42px;
      height: 42px;
      opacity: 0;
      transform-origin: center bottom;
    }
    .task-mini-tomato.dropped {
      animation: taskDropSquash 0.65s cubic-bezier(0.28, 0.84, 0.42, 1) forwards;
    }
    @keyframes taskDropSquash {
      0% { transform: translateY(-70px) scale(0.8, 1.3); opacity: 0; }
      55% { transform: translateY(0) scale(1.3, 0.7); opacity: 1; }
      75% { transform: translateY(-12px) scale(0.9, 1.1); }
      90% { transform: translateY(0) scale(1.08, 0.92); }
      100% { transform: translateY(0) scale(1, 1); opacity: 1; }
    }

    .task-cheer-wiggle {
      animation: taskCheer 0.3s ease-in-out infinite alternate;
    }
    @keyframes taskCheer {
      from { transform: translateY(-3px) rotate(-6deg); }
      to { transform: translateY(-3px) rotate(6deg); }
    }

    .task-clock-stage {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 12px;
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .task-clock-stage.visible {
      opacity: 1;
      transform: scale(1);
    }

    .task-clock-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(2px 3px 0px rgba(0, 0, 0, 0.4));
    }

    .task-hand-lap {
      animation: taskWindUpHand 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: 50px 50px;
    }
    @keyframes taskWindUpHand {
      0% { transform: rotate(0deg); }
      80% { transform: rotate(380deg); }
      100% { transform: rotate(360deg); }
    }

    .task-quote-box {
      min-height: 38px;
      margin-bottom: 18px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      border: 2px dashed #ffffff;
      border-radius: 8px;
      max-width: 90%;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .task-quote-box.visible {
      opacity: 1;
    }

    .task-quote-text {
      color: #fffb8f;
      font-size: clamp(0.75rem, 2.2vw, 0.85rem);
      letter-spacing: 0.5px;
      font-weight: 700;
      line-height: 1.4;
    }

    .task-quote-cursor {
      display: inline-block;
      width: 6px;
      height: 12px;
      background: #fffb8f;
      margin-left: 4px;
      animation: taskCursorBlink 0.7s steps(1) infinite;
    }
    @keyframes taskCursorBlink {
      0%, 50% { opacity: 1; }
      50.1%, 100% { opacity: 0; }
    }

    .task-title-wrapper {
      margin-bottom: 14px;
    }

    h1.task-pixel-title {
      font-family: var(--font-pixel);
      font-size: clamp(1.4rem, 4.6vw, 2.3rem);
      letter-spacing: 1px;
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      line-height: 1.3;
      text-shadow: var(--pixel-shadow);
    }

    .task-title-letter {
      display: inline-block;
      opacity: 0;
      transform: translateY(-50px);
    }
    .task-title-letter.animate-in {
      animation: taskLetterDrop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.25) forwards;
    }
    @keyframes taskLetterDrop {
      to { opacity: 1; transform: translateY(0); }
    }

    p.task-subtitle {
      font-size: clamp(0.75rem, 2.3vw, 0.9rem);
      line-height: 1.5;
      margin-bottom: 20px;
      max-width: 440px;
      text-shadow: 1px 1px 0px #000;
    }

    .task-form {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .task-form.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .task-input-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    #task-input {
      width: 100%;
      background-color: var(--cream-input);
      border: 4px solid #000000;
      color: #111111;
      font-family: var(--font-silk);
      font-size: 0.95rem;
      padding: 13px 18px;
      border-radius: 28px;
      box-shadow: var(--pixel-shadow);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #task-input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 0 3px #000000, 0 0 10px rgba(255, 255, 255, 0.6);
    }

    .task-error-shake {
      animation: taskShakeInput 0.35s ease-in-out;
      border-color: #ffd166 !important;
    }
    @keyframes taskShakeInput {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .task-inline-error {
      min-height: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fffb8f;
      text-shadow: 1px 1px 0px #000;
      margin-top: 6px;
    }

    .task-picker-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      opacity: 0.9;
    }

    .task-segmented-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .task-segmented-btn {
      background: transparent;
      border: 3px solid #ffffff;
      color: #ffffff;
      font-family: var(--font-pixel);
      font-size: 0.7rem;
      padding: 9px 13px;
      cursor: pointer;
      box-shadow: var(--pixel-shadow-sm);
      transition: background-color 0.15s, color 0.15s, transform 0.05s;
    }
    .task-segmented-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    .task-segmented-btn.selected {
      background-color: #ffffff;
      color: var(--bg-color);
      box-shadow: var(--pixel-shadow-press);
    }

    #custom-duration-wrapper {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #custom-duration-input {
      width: 80px;
      background: var(--cream-input);
      border: 3px solid #000000;
      font-family: var(--font-pixel);
      font-size: 0.8rem;
      padding: 6px;
      text-align: center;
      border-radius: 8px;
      box-shadow: var(--pixel-shadow-sm);
    }

    .task-submit-btn {
      background: transparent;
      color: var(--text-white);
      font-family: var(--font-pixel);
      font-size: 1rem;
      border: 4px solid #ffffff;
      padding: 14px 34px;
      margin-top: 8px;
      cursor: pointer;
      box-shadow: var(--pixel-shadow);
      text-transform: uppercase;
      transition: background-color 0.15s, color 0.15s, transform 0.05s, box-shadow 0.05s;
    }
    .task-submit-btn:hover {
      background-color: #ffffff;
      color: var(--bg-color);
    }
    .task-submit-btn:active {
      transform: translate(3px, 3px);
      box-shadow: var(--pixel-shadow-press);
    }

    .task-session-summary {
      font-size: 0.8rem;
      letter-spacing: 0.5px;
      color: #ffe5ec;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px 14px;
      border-radius: 12px;
      margin-top: 2px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* ==========================================================================
       4. Countdown CSS
       ========================================================================== */
    .countdown-title {
      font-family: var(--font-pixel);
      font-size: clamp(1.4rem, 4.6vw, 2.3rem);
      margin-bottom: 12px;
      text-shadow: var(--pixel-shadow);
    }

    .countdown-task-pill {
      font-size: 1rem;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 2px dashed #ffffff;
      word-break: break-word;
      max-width: 90%;
      margin-bottom: 12px;
    }

    .countdown-timer-display {
      font-family: var(--font-pixel);
      font-size: clamp(3rem, 11vw, 5rem);
      margin: 25px 0;
      letter-spacing: 2px;
      text-shadow: var(--pixel-shadow);
    }

    .countdown-controls-row {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .countdown-btn {
      background: transparent;
      color: var(--text-white);
      font-family: var(--font-pixel);
      font-size: 0.85rem;
      border: 4px solid #ffffff;
      padding: 12px 24px;
      cursor: pointer;
      box-shadow: var(--pixel-shadow);
      text-transform: uppercase;
      transition: background-color 0.15s, color 0.15s, transform 0.05s, box-shadow 0.05s;
    }
    .countdown-btn:hover {
      background-color: #ffffff;
      color: var(--bg-color);
    }
    .countdown-btn:active {
      transform: translate(3px, 3px);
      box-shadow: var(--pixel-shadow-press);
    }

    /* ==========================================================================
       5. Screen 3 CSS (Finish)
       ========================================================================== */
    #finish-screen {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform-style: preserve-3d;
    }

    .finish-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 90;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, transparent 20%, rgba(20, 0, 2, 0.85) 90%);
      transition: opacity 0.5s ease;
    }
    .finish-vignette.active {
      opacity: 1;
    }

    #finish-splatter-canvas, #finish-confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    #finish-splatter-canvas { z-index: 15; }
    #finish-confetti-canvas { z-index: 45; }

    .finish-slam-header {
      min-height: 52px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .finish-slam-text {
      font-family: var(--font-pixel);
      font-size: clamp(1.6rem, 5.5vw, 2.8rem);
      letter-spacing: 2px;
      text-shadow: var(--pixel-shadow);
      opacity: 0;
      transform: scale(3.5);
    }
    .finish-slam-in {
      animation: finishTextSlam 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes finishTextSlam {
      0% { opacity: 0; transform: scale(3.5); }
      70% { opacity: 1; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    .finish-arena {
      position: relative;
      width: 260px;
      height: 260px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .finish-floor-shadow {
      position: absolute;
      bottom: 12px;
      left: 15%;
      width: 70%;
      height: 24px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.5) 0%, transparent 72%);
      border-radius: 50%;
      transform-origin: center;
      transition: transform 0.25s ease;
    }

    .finish-tomato-actor {
      position: relative;
      width: 100%;
      height: 100%;
      transform-origin: center bottom;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .finish-tomato-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(4px 6px 0px rgba(0, 0, 0, 0.35));
    }

    #finish-fuse-group {
      opacity: 0;
      transform-origin: 100px 30px;
    }
    .finish-fuse-burning {
      opacity: 1 !important;
    }

    .finish-fuse-spark {
      animation: finishSparkFlicker 0.12s infinite alternate;
    }
    @keyframes finishSparkFlicker {
      0% { transform: scale(0.8) translate(-1px, -1px); opacity: 0.8; }
      100% { transform: scale(1.3) translate(1px, 1px); opacity: 1; }
    }

    .finish-fuse-countdown {
      position: absolute;
      top: -8px;
      right: 18px;
      font-family: var(--font-pixel);
      font-size: 1.2rem;
      background: #000000;
      color: #ffd166;
      border: 2px solid #ffffff;
      padding: 4px 8px;
      box-shadow: var(--pixel-shadow-sm);
      opacity: 0;
    }
    .finish-fuse-countdown.visible {
      opacity: 1;
    }

    .finish-face-element {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .finish-sweat-drop {
      opacity: 0;
      animation: finishSweatDrip 0.5s ease-in-out infinite;
    }
    @keyframes finishSweatDrip {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(8px); opacity: 0; }
    }

    .finish-spiral-eye {
      transform-origin: center;
      animation: finishEyeSpin 0.35s linear infinite;
    }
    @keyframes finishEyeSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    #finish-skin-veins {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .finish-shake-mild {
      animation: finishShakeMild 0.15s infinite;
    }
    @keyframes finishShakeMild {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-3px, 2px); }
      75% { transform: translate(3px, -2px); }
    }

    .finish-shake-wild {
      animation: finishShakeWild 0.08s infinite;
    }
    @keyframes finishShakeWild {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-8px, 6px) rotate(-1deg); }
      50% { transform: translate(7px, -7px) rotate(1.5deg); }
      75% { transform: translate(-6px, -5px) rotate(-1.5deg); }
    }

    .finish-knife-actor {
      position: absolute;
      width: 220px;
      height: 120px;
      top: -160px;
      right: -160px;
      pointer-events: none;
      z-index: 40;
      opacity: 0;
      filter: drop-shadow(4px 4px 0px rgba(0, 0, 0, 0.4));
    }
    .finish-knife-swoosh {
      animation: finishKnifeSwoosh 0.32s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    @keyframes finishKnifeSwoosh {
      0% { opacity: 1; transform: translate(0, 0) rotate(-40deg); }
      70% { opacity: 1; transform: translate(-230px, 200px) rotate(-15deg); }
      100% { opacity: 1; transform: translate(-270px, 240px) rotate(-10deg); }
    }

    .finish-halves-container {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
    }
    .finish-half-tomato {
      position: absolute;
      width: 100px;
      height: 140px;
    }
    .finish-half-left {
      left: 15px;
      bottom: 20px;
      transform-origin: right bottom;
    }
    .finish-half-right {
      right: 15px;
      bottom: 20px;
      transform-origin: left bottom;
    }
    .finish-fall-left {
      animation: finishFallLeft 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    .finish-fall-right {
      animation: finishFallRight 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    @keyframes finishFallLeft {
      0% { transform: translate(0, 0) rotate(0deg); }
      60% { transform: translate(-45px, 25px) rotate(-45deg); }
      80% { transform: translate(-48px, 18px) rotate(-38deg); }
      100% { transform: translate(-50px, 25px) rotate(-42deg); }
    }
    @keyframes finishFallRight {
      0% { transform: translate(0, 0) rotate(0deg); }
      60% { transform: translate(45px, 25px) rotate(45deg); }
      80% { transform: translate(48px, 18px) rotate(38deg); }
      100% { transform: translate(50px, 25px) rotate(42deg); }
    }

    .finish-results-card {
      position: relative;
      z-index: 50;
      width: 100%;
      max-width: 490px;
      background: var(--cream-card);
      color: #111111;
      border: 4px solid #000000;
      box-shadow: 6px 6px 0px #000000;
      padding: 28px 24px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      opacity: 0;
      transform: translateY(60px) scale(0.9);
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }
    .finish-results-card.results-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .finish-results-title {
      font-family: var(--font-pixel);
      font-size: clamp(1rem, 3.4vw, 1.35rem);
      color: var(--bg-color);
      letter-spacing: 1px;
      line-height: 1.4;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px #000000;
    }

    .finish-task-badge {
      font-size: 0.95rem;
      font-weight: 700;
      background: rgba(193, 18, 31, 0.12);
      border: 2px dashed var(--bg-color);
      padding: 8px 16px;
      border-radius: 4px;
      word-break: break-word;
      max-width: 95%;
    }

    .finish-stat-line {
      font-size: 0.85rem;
      color: #444444;
      letter-spacing: 0.5px;
    }

    .finish-sessions-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 4px 0 8px 0;
    }
    .finish-session-badge {
      width: 32px;
      height: 32px;
      filter: drop-shadow(2px 2px 0px rgba(0, 0, 0, 0.3));
    }

    .finish-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: 100%;
      margin-top: 6px;
    }

    .finish-pixel-btn {
      background: transparent;
      color: #111111;
      font-family: var(--font-pixel);
      font-size: clamp(0.72rem, 2.2vw, 0.85rem);
      border: 3.5px solid #000000;
      padding: 13px 20px;
      cursor: pointer;
      box-shadow: var(--pixel-shadow-sm);
      text-transform: uppercase;
      transition: background-color 0.15s, color 0.15s, transform 0.05s, box-shadow 0.05s;
    }
    .finish-pixel-btn-primary {
      background: var(--bg-color);
      color: #ffffff;
      border-color: #000000;
    }
    .finish-pixel-btn-primary:hover {
      background: #e01e2b;
      box-shadow: 4px 4px 0px #000000, 0 0 12px rgba(193, 18, 31, 0.4);
    }
    .finish-pixel-btn-secondary:hover {
      background: #000000;
      color: #ffffff;
    }
    .finish-pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow: var(--pixel-shadow-press);
    }

    .finish-replay-btn {
      margin-top: 10px;
      font-size: 0.65rem;
      padding: 8px 14px;
      color: #555555;
      border: 2px dashed #000000;
      background: transparent;
      cursor: pointer;
      font-family: var(--font-pixel);
    }
    .finish-replay-btn:hover {
      background: #000000;
      color: #ffffff;
    }

    /* Accessibility: Prefers Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .intro-tomato-drop-wrapper,
      .intro-floor-shadow,
      .intro-btn-container,
      .intro-title-letter,
      .task-mini-tomato,
      .task-clock-stage,
      .task-form,
      .task-title-letter {
        opacity: 1 !important;
        transform: none !important;
      }
      #ambient-canvas,
      #task-splash-canvas,
      #finish-splatter-canvas,
      #finish-confetti-canvas,
      .crt-overlay,
      .finish-vignette,
      .finish-knife-actor,
      .finish-halves-container {
        display: none !important;
      }
      .finish-results-card {
        opacity: 1 !important;
        transform: none !important;
        pointer-events: auto !important;
      }
      .finish-slam-header, .finish-arena {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="sr-only" aria-live="assertive" id="sr-announcer"></div>

  <!-- Shared Overlays & Canvases -->
  <div class="crt-overlay" aria-hidden="true"></div>
  <div id="shared-flash-screen" class="flash-screen" aria-hidden="true"></div>
  <div id="shared-wipe-overlay" class="wipe-overlay" aria-hidden="true"></div>

  <!-- Shared Ambient Particles -->
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>

  <!-- Screen 2 Splash Canvas -->
  <canvas id="task-splash-canvas" aria-hidden="true"></canvas>

  <!-- Screen 3 Canvases & Vignette -->
  <div id="finish-vignette" class="finish-vignette" aria-hidden="true"></div>
  <canvas id="finish-splatter-canvas" aria-hidden="true"></canvas>
  <canvas id="finish-confetti-canvas" aria-hidden="true"></canvas>

  <!-- Shared Mute / Unmute Button -->
  <button id="shared-mute-btn" class="mute-btn" aria-label="Toggle Sound: Muted" title="Toggle Sound">
    <svg id="shared-mute-icon-muted" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
    <svg id="shared-mute-icon-unmuted" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
  </button>

  <!-- ==========================================================================
       6. HTML Screens
       ========================================================================== -->

  <!-- SCREEN 1: INTRO SCREEN -->
  <main id="intro-screen" class="screen-stage">
    <header class="intro-title-wrapper">
      <h1 class="intro-pixel-title" id="intro-pixel-title" aria-label="POMO CHRONO"></h1>
    </header>

    <div class="intro-tagline-container">
      <span class="intro-tagline-text" id="intro-tagline-text"></span>
      <span class="intro-cursor" aria-hidden="true"></span>
    </div>

    <div class="intro-tomato-stage" id="intro-tomato-stage" role="button" tabindex="0" aria-label="Interactive Tomato Timer. Click to ring.">
      <div class="intro-floor-shadow" aria-hidden="true"></div>

      <div class="intro-tomato-drop-wrapper" id="intro-tomato-drop">
        <div id="intro-tomato-shaker">
          <svg class="intro-tomato-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="intro-tomato-grad" cx="42%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#ff3b47"/>
                <stop offset="45%" stop-color="#d01323"/>
                <stop offset="90%" stop-color="#800611"/>
                <stop offset="100%" stop-color="#4d0007"/>
              </radialGradient>

              <radialGradient id="intro-highlight-grad" cx="40%" cy="32%" r="45%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
                <stop offset="40%" stop-color="#ffffff" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
              </radialGradient>

              <linearGradient id="intro-rim-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#70050d"/>
                <stop offset="100%" stop-color="#2d0004"/>
              </linearGradient>

              <linearGradient id="intro-leaf-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#4ad66d"/>
                <stop offset="70%" stop-color="#1b7a36"/>
                <stop offset="100%" stop-color="#0f4d21"/>
              </linearGradient>

              <linearGradient id="intro-stem-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#34aa52"/>
                <stop offset="100%" stop-color="#145224"/>
              </linearGradient>
            </defs>

            <!-- Stem and Calyx Leaves -->
            <g class="intro-leaf-sway">
              <path d="M96 35 C94 20, 102 12, 114 8 C116 16, 108 24, 102 36 Z" fill="url(#intro-stem-grad)" stroke="#092d13" stroke-width="2"/>
              <path d="M100 36 C80 20, 52 30, 56 46 C70 45, 88 40, 100 36 Z" fill="#0f4d21"/>
              <path d="M100 36 C82 18, 54 26, 62 44 C76 43, 90 39, 100 36 Z" fill="url(#intro-leaf-grad)" stroke="#092d13" stroke-width="2"/>
              <path d="M100 36 C118 16, 146 22, 138 40 C124 40, 110 38, 100 36 Z" fill="url(#intro-leaf-grad)" stroke="#092d13" stroke-width="2"/>
              <path d="M100 36 C92 48, 92 62, 102 64 C108 55, 106 44, 100 36 Z" fill="url(#intro-leaf-grad)" stroke="#092d13" stroke-width="2"/>
            </g>

            <!-- Tilted Tomato Body -->
            <g transform="rotate(-15 100 112)">
              <ellipse cx="100" cy="116" rx="77" ry="73" fill="url(#intro-rim-grad)"/>
              <ellipse cx="100" cy="112" rx="76" ry="72" fill="url(#intro-tomato-grad)" stroke="#1a0002" stroke-width="4.5"/>

              <g class="intro-highlight-move">
                <ellipse cx="78" cy="74" rx="28" ry="16" transform="rotate(-20 78 74)" fill="url(#intro-highlight-grad)"/>
              </g>

              <path d="M26 114 Q 100 134 174 114" stroke="#220003" stroke-width="4.5" fill="none" stroke-linecap="round"/>

              <!-- Rotating Cream Dial Assembly -->
              <g id="intro-dial-group">
                <ellipse cx="100" cy="112" rx="55" ry="51" fill="var(--cream-dial)" stroke="#1a0002" stroke-width="4"/>
                <ellipse cx="100" cy="112" rx="34" ry="31" fill="#edd8b1" stroke="#331c07" stroke-width="2.5"/>

                <g id="intro-dial-ticks-container"></g>

                <polygon points="100,64 94,76 106,76" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="100" cy="112" r="7" fill="#800611" stroke="#000000" stroke-width="2"/>
                <circle cx="100" cy="112" r="2.5" fill="#ffffff"/>
              </g>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <div class="intro-btn-container">
      <button id="start-button">START</button>
    </div>
  </main>

  <!-- SCREEN 2: SET YOUR TASK -->
  <main id="task-screen" class="screen-stage hidden">
    <a id="task-back-link" class="task-back-link" href="#" role="button" aria-label="Back to intro">&larr; BACK TO INTRO</a>

    <div class="task-tomato-row" id="task-tomato-row" aria-label="Five mini session tomatoes"></div>

    <div class="task-clock-stage" id="task-clock-stage">
      <svg class="task-clock-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clock duration preview">
        <circle cx="50" cy="50" r="46" fill="#fff4da" stro
        ke="#000000" stroke-width="4"/>
        <circle id="task-clock-lap1" cx="50" cy="50" r="44" fill="rgba(193, 18, 31, 0.45)" style="display:none"/>
        <path id="task-clock-wedge" d="" fill="rgba(193, 18, 31, 0.45)" stroke="#c1121f" stroke-width="1.5"/>
        <g id="task-clock-ticks"></g>
        <g id="task-clock-hand" transform="rotate(0 50 50)">
          <line x1="50" y1="50" x2="50" y2="16" stroke="#220003" stroke-width="3" stroke-linecap="round"/>
          <polygon points="50,11 47,18 53,18" fill="#c1121f"/>
        </g>
        <circle cx="50" cy="50" r="4.5" fill="#000000"/>
        <circle cx="50" cy="50" r="2" fill="#ffffff"/>
      </svg>
    </div>

    <div class="task-quote-box" id="task-quote-box">
      <span class="task-quote-text" id="task-quote-text"></span>
      <span class="task-quote-cursor" aria-hidden="true"></span>
    </div>

    <header class="task-title-wrapper">
      <h1 class="task-pixel-title" id="task-screen-title" aria-label="SET YOUR TASK"></h1>
    </header>
    <p class="task-subtitle">Write down the task you want to achieve during this session.</p>

    <form class="task-form" id="task-form" novalidate>
      <div class="task-input-group">
        <input type="text" id="task-input" placeholder="e.g. Finish my math exercises" autocomplete="off" maxlength="45">
        <p class="task-inline-error" id="task-input-error" aria-live="polite"></p>
      </div>

      <div class="task-input-group">
        <span class="task-picker-label">Focus Duration</span>
        <div class="task-segmented-group" id="task-duration-picker" role="radiogroup" aria-label="Focus Duration">
          <button type="button" role="radio" aria-checked="false" tabindex="-1" class="task-segmented-btn" data-min="15">15m</button>
          <button type="button" role="radio" aria-checked="true" tabindex="0" class="task-segmented-btn selected" data-min="25">25m</button>
          <button type="button" role="radio" aria-checked="false" tabindex="-1" class="task-segmented-btn" data-min="45">45m</button>
          <button type="button" role="radio" aria-checked="false" tabindex="-1" class="task-segmented-btn" data-min="60">60m</button>
          <button type="button" role="radio" aria-checked="false" tabindex="-1" class="task-segmented-btn" data-min="custom">Custom</button>
        </div>

        <div id="custom-duration-wrapper" class="hidden">
          <label for="custom-duration-input" style="font-size:0.75rem;">Minutes:</label>
          <input type="number" id="custom-duration-input" min="0.1" max="120" step="any" value="30">
        </div>
      </div>

      <div class="task-input-group">
        <span class="task-picker-label">Break Length</span>
        <div class="task-segmented-group" id="task-break-picker" role="radiogroup" aria-label="Break Length">
          <button type="button" role="radio" aria-checked="true" tabindex="0" class="task-segmented-btn selected" data-break="5">5m</button>
          <button type="button" role="radio" aria-checked="false" tabindex="-1" class="task-segmented-btn" data-break="10">10m</button>
        </div>
      </div>

      <div class="task-session-summary" id="task-session-summary">25 min focus, 5 min break</div>

      <button type="submit" id="set-timer-button" class="task-submit-btn">SET TIMER</button>
    </form>
  </main>

  <!-- SCREEN 4: COUNTDOWN SCREEN -->
  <main id="countdown-screen" class="screen-stage hidden">
    <h1 class="countdown-title" id="countdown-heading">LET'S GO!</h1>
    <div id="countdown-task-pill" class="countdown-task-pill">Task Name</div>
    <div id="countdown-digits" class="countdown-timer-display">25:00</div>

    <div class="countdown-controls-row">
      <button id="pause-resume-btn" class="countdown-btn">PAUSE</button>
      <button id="reset-btn" class="countdown-btn" style="border-color:#ffeb3b;">RESET</button>
    </div>
  </main>

  <!-- SCREEN 5: FINISH SCREEN -->
  <main id="finish-screen" class="screen-stage hidden">
    <header class="finish-slam-header">
      <h1 class="finish-slam-text" id="finish-slam-title">TIME'S UP!</h1>
    </header>

    <div class="finish-arena" id="finish-arena">
      <div class="finish-floor-shadow" id="finish-floor-shadow"></div>
      <div class="finish-fuse-countdown" id="finish-fuse-counter">3</div>

      <div class="finish-knife-actor" id="finish-knife-actor">
        <svg viewBox="0 0 220 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M60 20 L210 10 L190 30 Z" fill="rgba(255,255,255,0.4)"/>
          <path d="M40 35 L200 25 L180 45 Z" fill="rgba(255,255,255,0.2)"/>
          <path d="M10 50 Q 80 46 160 48 L 155 78 Q 80 78 10 50 Z" fill="#e2e8f0" stroke="#000000" stroke-width="3"/>
          <path d="M15 52 L 155 52" stroke="#ffffff" stroke-width="2.5"/>
          <rect x="155" y="52" width="60" height="22" rx="4" fill="#8b4513" stroke="#000000" stroke-width="3"/>
          <circle cx="175" cy="63" r="2.5" fill="#ffd166"/>

  <!-- ==========================================================================
       7. Shared JS
       ========================================================================== -->
  <script>
    // Global State
    let isMuted = true;
    let audioCtx = null;
    let currentScreenId = "intro-screen";
    let activeTask = "Finish my math exercises";
    let selectedDuration = 25;
    let selectedBreak = 5;
    const isTestMode = window.location.search.includes("test");

    // Screens
    const introScreen = document.getElementById("intro-screen");
    const taskScreen = document.getElementById("task-screen");
    const countdownScreen = document.getElementById("countdown-screen");
    const finishScreen = document.getElementById("finish-screen");
    const allScreens = [introScreen, taskScreen, countdownScreen, finishScreen];

    // Shared UI
    const sharedMuteBtn = document.getElementById("shared-mute-btn");
    const sharedMuteIconMuted = document.getElementById("shared-mute-icon-muted");
    const sharedMuteIconUnmuted = document.getElementById("shared-mute-icon-unmuted");
    const sharedFlashScreen = document.getElementById("shared-flash-screen");
    const sharedWipeOverlay = document.getElementById("shared-wipe-overlay");
    const srAnnouncer = document.getElementById("sr-announcer");

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type, param = 0) {
      if (isMuted) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      if (type === 'tick') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.025);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.025);
      } else if (type === 'bellTick') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1480, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'ding') {
        [1046.5, 2093.0].forEach(f => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(f, now);
          g.gain.setValueAtTime(0.28, now);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
          o.connect(g);
          g.connect(ctx.destination);
          o.start(now);
          o.stop(now + 1.2);
        });
      } else if (type === 'click') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.setValueAtTime(220, now + 0.03);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'splash') {
        const bufferSize = ctx.sampleRate * 0.25;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.exponentialRampToValueAtTime(100, now + 0.25);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(now);
        noise.stop(now + 0.25);
      } else if (type === 'whoosh') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.28);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      } else if (type === 'splat') {
        const bufferSize = ctx.sampleRate * 0.45;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1800, now);
        filter.frequency.exponentialRampToValueAtTime(80, now + 0.4);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.65, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(now);
        noise.stop(now + 0.45);
      } else if (type === 'fanfare') {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((f, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + idx * 0.09);
          gain.gain.setValueAtTime(0.25, now + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.32);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 0.32);
        });
      } else if (type === 'fuseTick') {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        const baseFreq = 600 + (param * 220);
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.035);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.035);
      }
    }

    sharedMuteBtn.addEventListener("click", () => {
      isMuted = !isMuted;
      getAudioContext();
      if (isMuted) {
        sharedMuteIconMuted.style.display = "block";
        sharedMuteIconUnmuted.style.display = "none";
        sharedMuteBtn.setAttribute("aria-label", "Toggle Sound: Muted");
      } else {
        sharedMuteIconMuted.style.display = "none";
        sharedMuteIconUnmuted.style.display = "block";
        sharedMuteBtn.setAttribute("aria-label", "Toggle Sound: Unmuted");
        playSound('tick');
      }
    });

    // Ambient Canvas Drifting Pixels
    const ambCanvas = document.getElementById("ambient-canvas");
    const ambCtx = ambCanvas.getContext("2d");
    let winWidth, winHeight;
    const ambParticles = [];

    function handleResize() {
      winWidth = window.innerWidth;
      winHeight = window.innerHeight;
      ambCanvas.width = winWidth;
      ambCanvas.height = winHeight;
      resizeTaskCanvas();
      resizeFinishCanvases();
    }
    window.addEventListener("resize", handleResize);

    for (let i = 0; i < 30; i++) {
      ambParticles.push({
        x: Math.random() * (window.innerWidth || 500),
        y: Math.random() * (window.innerHeight || 800),
        size: Math.random() > 0.6 ? 4 : 2.5,
        speedY: -(0.3 + Math.random() * 0.5),
        speedX: (Math.random() - 0.5) * 0.4,
        alpha: 0.15 + Math.random() * 0.35,
        isLeaf: Math.random() > 0.75
      });
    }

    function renderAmbient() {
      ambCtx.clearRect(0, 0, winWidth, winHeight);
      ambParticles.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y < -10) p.y = winHeight + 10;
        if (p.x < -10) p.x = winWidth + 10;
        if (p.x > winWidth + 10) p.x = -10;

        ambCtx.fillStyle = p.isLeaf
          ? `rgba(74, 214, 109, ${p.alpha})`
          : `rgba(255, 255, 255, ${p.alpha})`;
        ambCtx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
      });
      requestAnimationFrame(renderAmbient);
    }

    // Parallax tracking active screen
    window.addEventListener("mousemove", (e) => {
      const normX = (e.clientX / window.innerWidth) - 0.5;
      const normY = (e.clientY / window.innerHeight) - 0.5;
      const activeStage = document.getElementById(currentScreenId);
      if (activeStage && (currentScreenId === "intro-screen" || currentScreenId === "task-screen")) {
        activeStage.style.transform = `translate3d(${(normX * 18).toFixed(2)}px, ${(normY * 14).toFixed(2)}px, 0)`;
      }
    });

    // Central Screen Switcher
    function showScreen(targetId) {
      // 1. Stop active loops of outgoing screen
      if (currentScreenId === "intro-screen") stopIntro();
      else if (currentScreenId === "task-screen") stopTask();
      else if (currentScreenId === "countdown-screen") stopCountdownTimer();
      else if (currentScreenId === "finish-screen") stopFinish();

      // 2. Hide all and display target
      allScreens.forEach(s => s.classList.add("hidden"));
      const target = document.getElementById(targetId);
      target.classList.remove("hidden");
      target.style.transform = "none";
      currentScreenId = targetId;

      // 3. Trigger target init
      if (targetId === "intro-screen") initIntro();
      else if (targetId === "task-screen") initTask();
      else if (targetId === "finish-screen") initFinish();
    }

    /* ==========================================================================
       8. Screen 1 JS (Intro)
       ========================================================================== */
    const introTitle = document.getElementById("intro-pixel-title");
    const introTagline = document.getElementById("intro-tagline-text");
    const introDialGroup = document.getElementById("intro-dial-group");
    const introTomatoShaker = document.getElementById("intro-tomato-shaker");
    const introStartBtn = document.getElementById("start-button");
    const introTomatoStage = document.getElementById("intro-tomato-stage");

    let introTickAngle = 0;
    let introTickCount = 0;
    let introTickInterval = null;
    let introIsHoveringStart = false;
    let introTypeTimer = null;

    function buildIntroDial() {
      const dialContainer = document.getElementById("intro-dial-ticks-container");
      dialContainer.innerHTML = '';
      const cx = 100, cy = 112, rx = 54, ry = 50;

      for (let i = 0; i < 60; i++) {
        const deg = (i * 6) - 90;
        const rad = (deg * Math.PI) / 180;
        const isMajor = i % 5 === 0;

        const x1 = cx + rx * Math.cos(rad);
        const y1 = cy + ry * Math.sin(rad);
        const len = isMajor ? 8.5 : 4.5;
        const x2 = cx + (rx - len) * Math.cos(rad);
        const y2 = cy + (ry - len) * Math.sin(rad);

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1.toFixed(2));
        line.setAttribute('y1', y1.toFixed(2));
        line.setAttribute('x2', x2.toFixed(2));
        line.setAttribute('y2', y2.toFixed(2));
        line.setAttribute('stroke', '#220003');
        line.setAttribute('stroke-width', isMajor ? '2' : '1.2');
        dialContainer.appendChild(line);

        if (isMajor) {
          const tx = cx + (rx - 14) * Math.cos(rad);
          const ty = cy + (ry - 14) * Math.sin(rad);
          const textEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          textEl.setAttribute('x', tx.toFixed(2));
          textEl.setAttribute('y', (ty + 2.5).toFixed(2));
          textEl.setAttribute('text-anchor', 'middle');
          textEl.setAttribute('font-size', '6');
          textEl.setAttribute('font-family', 'var(--font-silk)');
          textEl.setAttribute('font-weight', 'bold');
          textEl.setAttribute('fill', '#1c0305');
          textEl.textContent = i;
          dialContainer.appendChild(textEl);
        }
      }
    }

    function introExecuteTick() {
      if (introIsHoveringStart) return;
      introTickCount++;
      introTickAngle = (introTickAngle - 6) % 360;
      const isFifth = introTickCount % 5 === 0;

      introDialGroup.style.transform = `rotate(${introTickAngle}deg)`;
      introDialGroup.style.transformOrigin = '100px 112px';

      introTomatoShaker.classList.remove('intro-tick-shake', 'intro-bell-wiggle');
      void introTomatoShaker.offsetWidth;
      introTomatoShaker.classList.add(isFifth ? 'intro-bell-wiggle' : 'intro-tick-shake');

      playSound(isFifth ? 'bellTick' : 'tick');
    }

    function initIntro() {
      document.title = "Pomo Chrono - Retro Pomodoro Timer";
      buildIntroDial();
      introTickAngle = 0;
      introTickCount = 0;
      introDialGroup.style.transform = "rotate(0deg)";
      introTomatoShaker.classList.remove('intro-tick-shake', 'intro-bell-wiggle', 'intro-manual-ding');

      // Title drop
      introTitle.innerHTML = '';
      const text = "POMO CHRONO";
      text.split('').forEach((ch, idx) => {
        const span = document.createElement('span');
        span.className = 'intro-title-letter';
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        span.style.animationDelay = `${0.5 + idx * 0.07}s`;
        introTitle.appendChild(span);
      });

      // Typewriter
      introTagline.textContent = '';
      clearTimeout(introTypeTimer);
      const tagStr = "Study smarter with this pomodoro timer !";
      let charIdx = 0;
      function typeTag() {
        if (charIdx < tagStr.length) {
          introTagline.textContent += tagStr.charAt(charIdx);
          charIdx++;
          introTypeTimer = setTimeout(typeTag, 45);
        }
      }
      introTypeTimer = setTimeout(typeTag, 1400);

      // Start ticker
      clearInterval(introTickInterval);
      introTickInterval = setInterval(introExecuteTick, 1000);
    }

    function stopIntro() {
      clearInterval(introTickInterval);
      introTickInterval = null;
      clearTimeout(introTypeTimer);
      introDialGroup.classList.remove('intro-fast-dial-spin');
      introTitle.classList.remove('glitch');
      introScreen.classList.remove('intro-stage-launch');
    }

    // Tomato manual ring
    function triggerIntroDing() {
      introTomatoShaker.classList.remove('intro-manual-ding', 'intro-tick-shake', 'intro-bell-wiggle');
      void introTomatoShaker.offsetWidth;
      introTomatoShaker.classList.add('intro-manual-ding');
      playSound('ding');
    }
    introTomatoStage.addEventListener('click', triggerIntroDing);
    introTomatoStage.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        triggerIntroDing();
      }
    });

    // Start button hover & launch
    introStartBtn.addEventListener('mouseenter', () => {

    function resizeTaskCanvas() {
      taskSplashCanvas.width = window.innerWidth;
      taskSplashCanvas.height = window.innerHeight;

    function buildTaskClockTicks() {
      taskClockTicks.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        const rad = (i * 30 - 90) * (Math.PI / 180);
        const x1 = 50 + 40 * Math.cos(rad);
        const y1 = 50 + 40 * Math.sin(rad);
        const x2 = 50 + 34 * Math.cos(rad);
        const y2 = 50 + 34 * Math.sin(rad);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1.toFixed(1));
        line.setAttribute('y1', y1.toFixed(1));
        line.setAttribute('x2', x2.toFixed(1));
        line.setAttribute('y2', y2.toFixed(1));
        line.setAttribute('stroke', '#000000');
        line.setAttribute('stroke-width', i % 3 === 0 ? '2.5' : '1.5');
        taskClockTicks.appendChild(line);
      }
    }

    function updateTaskWedge(min) {
      const m = Math.min(Math.max(min, 0.1), 120);
      const rem = (m % 60 === 0) ? 60 : (m % 60);   // 60 and 120 count as a full circle
      const secondLap = m > 60;
      const angle = (rem / 60) * 360;

      let d;
      if (rem === 60) {
        // An arc can't end where it started, so a full circle is drawn as two half arcs
        d = 'M 50 50 L 50 6 A 44 44 0 1 1 50 94 A 44 44 0 1 1 50 6 Z';
      } else {
        const rad = (angle - 90) * (Math.PI / 180);
        const x = 50 + 44 * Math.cos(rad);
        const y = 50 + 44 * Math.sin(rad);
        d = `M 50 50 L 50 6 A 44 44 0 ${angle > 180 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z`;
      }

      taskClockWedge.setAttribute('d', d);
      taskClockWedge.setAttribute('fill', secondLap ? 'rgba(120, 0, 22, 0.7)' : 'rgba(193, 18, 31, 0.45)');
      document.getElementById('task-clock-lap1').style.display = secondLap ? 'block' : 'none';
    }

    function getTaskTomatoSVG(id) {
      return `
        <svg class="task-mini-tomato" id="${id}" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mini tomato">
          <path d="M25 10 C24 5, 27 2, 30 2 C29 5, 28 8, 25 10 Z" fill="var(--stem-green)"/>
          <path d="M25 10 C20 4, 13 8, 16 13 C20 12, 23 11, 25 10 Z" fill="var(--leaf-green)"/>
          <path d="M25 10 C30 4, 37 8, 34 13 C30 12, 27 11, 25 10 Z" fill="var(--leaf-green)"/>
          <path d="M24 10 C20 14, 21 18, 25 19 C26 16, 26 13, 24 10 Z" fill="var(--leaf-green)"/>
          <circle cx="25" cy="28" r="18" fill="#e01e2b" stroke="#000000" stroke-width="2.5"/>
          <ellipse cx="20" cy="22" rx="4" ry="2" fill="#ffffff" opacity="0.6"/>
        </svg>
      `;
    }

    function triggerTaskSplash(ox, oy) {
      playSound('splash');
      taskSplashParticles = [];
      for (let i = 0; i < 45; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 2.5 + Math.random() * 6.5;
        taskSplashParticles.push({
          x: ox,
          y: oy,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd - 1.5,
          radius: 3 + Math.random() * 5,
          alpha: 1,
          color: Math.random() > 0.3 ? '#e01e2b' : '#ff5964'
        });
      }
      isTaskSplashRunning = true;
      animateTaskSplash();
    }

    function animateTaskSplash() {
      if (!isTaskSplashRunning) return;
      taskSpCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      let alive = false;
      taskSplashParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.alpha -= 0.024;
        if (p.alpha > 0) {
          alive = true;
          taskSpCtx.save();
          taskSpCtx.globalAlpha = p.alpha;
          taskSpCtx.fillStyle = p.color;
          taskSpCtx.fillRect(p.x, p.y, p.radius, p.radius);
          taskSpCtx.restore();
        }
      });
      if (alive) requestAnimationFrame(animateTaskSplash);
      else {
        isTaskSplashRunning = false;
        taskSpCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }

    function updateTaskSummary() {
      taskSummary.textContent = `${selectedDuration} min focus, ${selectedBreak} min break`;
      updateTaskWedge(selectedDuration);
    }

    function initTask() {
      document.title = "Pomo Chrono - Set Your Task";
      buildTaskClockTicks();
      taskClockHand.classList.remove('task-hand-lap');
      taskClockStage.classList.remove('visible');
      taskForm.classList.remove('visible');
      taskInputError.textContent = '';
      taskInput.classList.remove('task-error-shake');

      taskQuoteText.textContent = '';
      taskQuoteBox.classList.remove('visible');
      taskTitleEl.innerHTML = '';

      // Populate 5 mini tomatoes
      taskTomatoRow.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        taskTomatoRow.insertAdjacentHTML('beforeend', getTaskTomatoSVG(`task-mini-${i}`));
      }

      taskTimeouts.forEach(id => clearTimeout(id));
      taskTimeouts = [];

      // 1. Tomatoes drop
      const minis = document.querySelectorAll('.task-mini-tomato');
      minis.forEach((t, idx) => {
        const id = setTimeout(() => {
          t.classList.add('dropped');
          playSound('tick');
          setTimeout(() => t.classList.add('task-cheer-wiggle'), 650);
        }, idx * 250);
        taskTimeouts.push(id);
      });

      // 2. Clock face sweeps
      const idClock = setTimeout(() => {
        taskClockStage.classList.add('visible');
        taskClockHand.classList.add('task-hand-lap');
        playSound('tick');
      }, 1300);
      taskTimeouts.push(idClock);

      // 3. Middle tomato burst
      const idBurst = setTimeout(() => {
        const centerTom = document.getElementById('task-mini-2');
        if (centerTom) {
          const r = centerTom.getBoundingClientRect();
          centerTom.style.visibility = 'hidden';
          triggerTaskSplash(r.left + r.width / 2, r.top + r.height / 2);
        }

        taskQuoteBox.classList.add('visible');
        const quote = taskQuotes[Math.floor(Math.random() * taskQuotes.length)];
        taskQuoteText.textContent = '';
        let cIdx = 0;
        function typeQ() {
          if (cIdx < quote.length) {
            taskQuoteText.textContent += quote.charAt(cIdx);
            cIdx++;
            const tQ = setTimeout(typeQ, 35);
            taskTimeouts.push(tQ);
          }
        }
        typeQ();
      }, 2100);
      taskTimeouts.push(idBurst);

      // 4. Title and Form entrance
      const idForm = setTimeout(() => {
        taskTitleEl.innerHTML = '';
        const tStr = "SET YOUR TASK";
        tStr.split('').forEach((ch, idx) => {
          const sp = document.createElement('span');
          sp.className = 'task-title-letter';
          sp.textContent = ch === ' ' ? '\u00A0' : ch;
          sp.style.animationDelay = `${idx * 0.04}s`;
          taskTitleEl.appendChild(sp);
          setTimeout(() => sp.classList.add('animate-in'), 10);
        });

        taskForm.classList.add('visible');
        updateTaskSummary();
        taskInput.focus();
      }, 2600);
      taskTimeouts.push(idForm);
    }

    function stopTask() {
      taskTimeouts.forEach(id => clearTimeout(id));
      taskTimeouts = [];
      isTaskSplashRunning = false;
      taskSpCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    // Back Link
    taskBackLink.addEventListener('click', (e) => {
      e.preventDefault();

    });

    // Duration Picker
    const durationBtns = Array.from(taskDurationPicker.querySelectorAll('.task-segmented-btn'));
    function setDurationOption(btn) {
      durationBtns.forEach(b => {
        b.classList.remove('selected');
        b.setAttribute('aria-checked', 'false');
        b.setAttribute('tabindex', '-1');
      });
      btn.classList.add('selected');
      btn.setAttribute('aria-checked', 'true');
      btn.setAttribute('tabindex', '0');
      btn.focus();

      const val = btn.dataset.min;
      if (val === 'custom') {
        customDurationWrapper.classList.remove('hidden');
        selectedDuration = parseFloat(customDurationInput.value) || 30;
      } else {
        customDurationWrapper.classList.add('hidden');
        selectedDuration = parseInt(val, 10);
      }
      playSound('click');
      updateTaskSummary();
    }

    durationBtns.forEach((btn, idx) => {
      btn.addEventListener('click', () => setDurationOption(btn));
      btn.addEventListener('keydown', (e) => {
        let nIdx = null;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nIdx = (idx + 1) % durationBtns.length;
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') nIdx = (idx - 1 + durationBtns.length) % durationBtns.length;
        if (nIdx !== null) {
          e.preventDefault();
          setDurationOption(durationBtns[nIdx]);
        }
      });
    });

    customDurationInput.addEventListener('input', () => {
      let v = parseFloat(customDurationInput.value);
      if (isNaN(v) || v < 0.1) v = 0.1;
      if (v > 120) v = 120;
      selectedDuration = v;
      updateTaskSummary();
    });

    // Break Picker
    const breakBtns = Array.from(taskBreakPicker.querySelectorAll('.task-segmented-btn'));
    breakBtns.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        breakBtns.forEach(b => {
          b.classList.remove('selected');
          b.setAttribute('aria-checked', 'false');
          b.setAttribute('tabindex', '-1');
        });
        btn.classList.add('selected');
        btn.setAttribute('aria-checked', 'true');
        btn.setAttribute('tabindex', '0');
        selectedBreak = parseInt(btn.dataset.break, 10);
        playSound('click');
        updateTaskSummary();
      });
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          e.preventDefault();
          breakBtns[(idx + 1) % breakBtns.length].click();
        }

    taskForm.addEventListener('submit', (e) => {

        return;

      activeTask = val;
      playSound('click');

    /* ==========================================================================
       10. Countdown JS
       ========================================================================== */
    const countdownHeading = document.getElementById("countdown-heading");
    const countdownTaskPill = document.getElementById("countdown-task-pill");
    const countdownDigits = document.getElementById("countdown-digits");
    const pauseResumeBtn = document.getElementById("pause-resume-btn");
    const resetBtn = document.getElementById("reset-btn");

    let countdownTimerId = null;
    let countdownRemainingSec = 0;
    let countdownIsPaused = false;
    let isBreakSession = false;

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
    }

    function stopCountdownTimer() {
      clearInterval(countdownTimerId);
      countdownTimerId = null;
    }

    function startCountdownSession(taskName, durationMin, isBreak = false) {
      stopCountdownTimer();
      isBreakSession = isBreak;
      countdownIsPaused = false;
      pauseResumeBtn.textContent = "PAUSE";

      countdownHeading.textContent = isBreak ? "BREAK TIME" : "LET'S GO!";
      countdownTaskPill.textContent = isBreak ? "Taking a well-deserved rest ☕" : taskName;

      // Handle ?test shortcut
      countdownRemainingSec = isTestMode ? 5 : Math.max(1, Math.round(durationMin * 60));
      countdownDigits.textContent = formatTime(countdownRemainingSec);
      document.title = `(${formatTime(countdownRemainingSec)}) ${isBreak ? 'Break' : 'Focus'}`;

      countdownTimerId = setInterval(() => {
        if (!countdownIsPaused && countdownRemainingSec > 0) {
          countdownRemainingSec--;
          countdownDigits.textContent = formatTime(countdownRemainingSec);
          document.title = `(${formatTime(countdownRemainingSec)}) ${isBreak ? 'Break' : 'Focus'}`;

          if (countdownRemainingSec === 0) {
            stopCountdownTimer();
            if (isBreakSession) {
              playSound('ding');
              showScreen("task-screen");
            } else {
              showScreen("finish-screen");
            }
          }
        }
      }, 1000);
    }

    pauseResumeBtn.addEventListener('click', () => {
      countdownIsPaused = !countdownIsPaused;
      pauseResumeBtn.textContent = countdownIsPaused ? "RESUME" : "PAUSE";
      playSound('click');
    });

    resetBtn.addEventListener('click', () => {
      stopCountdownTimer();
      playSound('click');
      showScreen("task-screen");
    });

       11. Screen 3 JS (Finish)
