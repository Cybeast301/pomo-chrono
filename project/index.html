    const finishSlamTitle = document.getElementById("finish-slam-title");
    const finishArena = document.getElementById("finish-arena");
    const finishFloorShadow = document.getElementById("finish-floor-shadow");
    const finishFuseGroup = document.getElementById("finish-fuse-group");
    const finishFuseCounter = document.getElementById("finish-fuse-counter");
    const finishKnifeActor = document.getElementById("finish-knife-actor");
    const finishTomatoActor = document.getElementById("finish-tomato-actor");
    const finishSkinVeins = document.getElementById("finish-skin-veins");
    const finishFaceWorried = document.getElementById("finish-face-worried");
    const finishFacePanicked = document.getElementById("finish-face-panicked");
    const finishFaceSpinning = document.getElementById("finish-face-spinning");
    const finishHalvesStage = document.getElementById("finish-halves-stage");
    const finishHalfLeftSvg = document.getElementById("finish-half-left-svg");
    const finishHalfRightSvg = document.getElementById("finish-half-right-svg");
    const finishResultsCard = document.getElementById("finish-results-card");
    const finishTaskNameBadge = document.getElementById("finish-task-name");
    const finishStatLine = document.getElementById("finish-stat-line");
    const finishVignette = document.getElementById("finish-vignette");
    const finishSplatterCanvas = document.getElementById("finish-splatter-canvas");
    const finishSpCtx = finishSplatterCanvas.getContext("2d");
    const finishConfettiCanvas = document.getElementById("finish-confetti-canvas");
    const finishCfCtx = finishConfettiCanvas.getContext("2d");
    
    const startAnotherBtn = document.getElementById("start-another-button");
    const takeBreakBtn = document.getElementById("take-break-button");

    let finishTimeline = [];
    let finishSplatterParticles = [];
    let finishDripParticles = [];
    let finishConfettiPieces = [];
    let isFinishSplatterRunning = false;
    let isFinishConfettiRunning = false;

    function resizeFinishCanvases() {
      finishSplatterCanvas.width = window.innerWidth;
      finishSplatterCanvas.height = window.innerHeight;
      finishConfettiCanvas.width = window.innerWidth;
      finishConfettiCanvas.height = window.innerHeight;
    }

    function scheduleFinish(fn, delay) {
      const id = setTimeout(fn, delay);
      finishTimeline.push(id);
      return id;
    }

    function stopFinish() {
      finishTimeline.forEach(id => clearTimeout(id));
      finishTimeline = [];
      isFinishSplatterRunning = false;
      isFinishConfettiRunning = false;
      finishSpCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      finishCfCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      finishVignette.classList.remove("active");
      finishScreen.classList.remove("finish-shake-mild", "finish-shake-wild");
      sharedFlashScreen.classList.remove("flash-active");
    }

    function createFinishSplatter(ox, oy) {
      finishSplatterParticles = [];
      finishDripParticles = [];
      for (let i = 0; i < 85; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 4 + Math.random() * 14;
        const isChunk = Math.random() > 0.75;
        finishSplatterParticles.push({
          x: ox,
          y: oy,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 2.5,
          radius: isChunk ? 7 + Math.random() * 7 : 4 + Math.random() * 8,
          color: isChunk ? '#ffd166' : (Math.random() > 0.4 ? '#c1121f' : '#880813'),
          alpha: 1,
          isChunk
        });
      }

      for (let i = 0; i < 18; i++) {
        finishDripParticles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * (window.innerHeight * 0.65),
          radius: 5 + Math.random() * 7,
          dripLength: 0,
          maxDrip: 30 + Math.random() * 55,
          speed: 0.3 + Math.random() * 0.7,
          alpha: 0.85
        });
      }
      isFinishSplatterRunning = true;
      animateFinishSplatter();
    }

    function animateFinishSplatter() {
      if (!isFinishSplatterRunning) return;
      finishSpCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      finishSplatterParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.32;
        p.alpha -= 0.014;
        if (p.alpha > 0) {
          finishSpCtx.save();
          finishSpCtx.globalAlpha = Math.max(0, p.alpha);
          finishSpCtx.fillStyle = p.color;
          if (p.isChunk) finishSpCtx.fillRect(p.x, p.y, p.radius, p.radius * 0.7);
          else {
            finishSpCtx.beginPath();
            finishSpCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            finishSpCtx.fill();
          }
          finishSpCtx.restore();
        }
      });

      finishDripParticles.forEach(d => {
        if (d.dripLength < d.maxDrip) d.dripLength += d.speed;
        finishSpCtx.save();
        finishSpCtx.fillStyle = "#8b0000";
        finishSpCtx.globalAlpha = d.alpha;
        finishSpCtx.beginPath();
        finishSpCtx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
        finishSpCtx.fill();
        finishSpCtx.fillRect(d.x - (d.radius * 0.4), d.y, d.radius * 0.8, d.dripLength);
        finishSpCtx.beginPath();
        finishSpCtx.arc(d.x, d.y + d.dripLength, d.radius * 0.45, 0, Math.PI * 2);
        finishSpCtx.fill();
        finishSpCtx.restore();
      });
      requestAnimationFrame(animateFinishSplatter);
    }

    function createFinishConfetti() {
      finishConfettiPieces = [];
      for (let i = 0; i < 45; i++) {
        finishConfettiPieces.push({
          x: window.innerWidth * 0.5,
          y: window.innerHeight * 0.45,
          vx: (Math.random() - 0.5) * 16,
          vy: - (5 + Math.random() * 11),
          size: 7 + Math.random() * 7,
          rot: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 12,
          isLeaf: Math.random() > 0.6
        });
      }
      isFinishConfettiRunning = true;
      animateFinishConfetti();
    }

    function animateFinishConfetti() {
      if (!isFinishConfettiRunning) return;
      finishCfCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      let alive = false;
      finishConfettiPieces.forEach(c => {
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.28;
        c.rot += c.rotSpeed;
        if (c.y < window.innerHeight + 20) {
          alive = true;
          finishCfCtx.save();
          finishCfCtx.translate(c.x, c.y);
          finishCfCtx.rotate((c.rot * Math.PI) / 180);
          finishCfCtx.fillStyle = c.isLeaf ? "#2b9348" : "#ffffff";
          finishCfCtx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.7);
          finishCfCtx.restore();
        }
      });
      if (alive) requestAnimationFrame(animateFinishConfetti);
      else {
        isFinishConfettiRunning = false;
        finishCfCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }

    function initFinish() {
      stopFinish();
      document.title = "Done! - Pomo Chrono";

      // Render Dynamic Results
      finishTaskNameBadge.textContent = activeTask;
      const secs = Math.round(selectedDuration * 60);
      const label = secs < 60 ? `${secs} seconds` : `${selectedDuration} minutes`;
      finishStatLine.innerHTML = `🎯 <strong>${label}</strong> focused session`;

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        finishResultsCard.classList.add("results-visible");
        srAnnouncer.textContent = "Time is up! Pomodoro session complete.";
        return;
      }

      // Reset Actor Nodes
      finishSlamTitle.style.display = "block";
      finishSlamTitle.textContent = "TIME'S UP!";
      finishSlamTitle.classList.remove("finish-slam-in");
      void finishSlamTitle.offsetWidth;

      finishTomatoActor.style.display = "block";
      finishTomatoActor.style.transform = "scale(1, 1)";
      finishFloorShadow.style.transform = "scale(1)";

      finishFaceWorried.style.opacity = "1";
      finishFacePanicked.style.opacity = "0";
      finishFaceSpinning.style.opacity = "0";
      finishSkinVeins.style.opacity = "0";
      finishFuseGroup.classList.remove("finish-fuse-burning");
      finishFuseCounter.classList.remove("visible");

      finishKnifeActor.classList.remove("finish-knife-swoosh");
      finishKnifeActor.style.opacity = "0";
      finishKnifeActor.style.display = "";

      finishHalvesStage.style.display = "none";
      finishHalfLeftSvg.classList.remove("finish-fall-left");
      finishHalfRightSvg.classList.remove("finish-fall-right");

      finishResultsCard.classList.remove("results-visible");
      srAnnouncer.textContent = "Time is up! Your Pomodoro has finished.";

      // STAGE 1: TICKING (0.0s - 1.5s)
      finishSlamTitle.classList.add("finish-slam-in");
      finishScreen.classList.add("finish-shake-mild");
      scheduleFinish(() => finishScreen.classList.remove("finish-shake-mild"), 400);

      finishFuseGroup.classList.add("finish-fuse-burning");
      finishFuseCounter.classList.add("visible");
      finishFuseCounter.textContent = "3";
      playSound('fuseTick', 0);

      scheduleFinish(() => { finishFuseCounter.textContent = "2"; playSound('fuseTick', 1); }, 500);
      scheduleFinish(() => { finishFuseCounter.textContent = "1"; playSound('fuseTick', 2); }, 1000);

      // STAGE 2: INFLATION (1.5s - 4.5s)
      scheduleFinish(() => {
        finishFuseCounter.classList.remove("visible");
        finishVignette.classList.add("active");
        finishTomatoActor.style.transform = "scale(1.4, 1.3)";
        finishFloorShadow.style.transform = "scale(1.35)";
        finishFaceWorried.style.opacity = "0";
        finishFacePanicked.style.opacity = "1";
        finishScreen.classList.add("finish-shake-mild");
        playSound('fuseTick', 3);
      }, 1500);

      scheduleFinish(() => {
        finishTomatoActor.style.transform = "scale(1.8, 1.7)";
        finishFloorShadow.style.transform = "scale(1.7)";
        finishSkinVeins.style.opacity = "0.7";
        playSound('fuseTick', 4);
      }, 2400);

      scheduleFinish(() => {
        finishTomatoActor.style.transform = "scale(2.2, 2.05)";
        finishFloorShadow.style.transform = "scale(2.05)";
        finishFacePanicked.style.opacity = "0";
        finishFaceSpinning.style.opacity = "1";
        finishSkinVeins.style.opacity = "1";
        finishScreen.classList.remove("finish-shake-mild");
        finishScreen.classList.add("finish-shake-wild");
        playSound('fuseTick', 5);
      }, 3300);

      scheduleFinish(() => {
        finishTomatoActor.style.transform = "scale(2.5, 2.35)";
        finishFloorShadow.style.transform = "scale(2.3)";
        playSound('fuseTick', 6);
      }, 4100);

      // STAGE 3: THE KNIFE (4.5s - 5.5s)
      scheduleFinish(() => {
        finishScreen.classList.remove("finish-shake-wild");
        finishSlamTitle.textContent = "SLICE!";
        finishSlamTitle.classList.remove("finish-slam-in");
        void finishSlamTitle.offsetWidth;
        finishSlamTitle.classList.add("finish-slam-in");

        finishKnifeActor.classList.add("finish-knife-swoosh");
        playSound('whoosh');
      }, 4600);

      // STAGE 4: THE BURST (5.5s - 7.0s)
      scheduleFinish(() => {
        sharedFlashScreen.classList.add("flash-active");
        finishScreen.classList.add("finish-shake-wild");
        playSound('splat');

        finishTomatoActor.style.display = "none";
        finishHalvesStage.style.display = "block";
        finishHalfLeftSvg.classList.add("finish-fall-left");
        finishHalfRightSvg.classList.add("finish-fall-right");

        const r = finishTomatoActor.getBoundingClientRect();
        createFinishSplatter(r.left + r.width / 2, r.top + r.height / 2);

        scheduleFinish(() => sharedFlashScreen.classList.remove("flash-active"), 120);
        scheduleFinish(() => finishScreen.classList.remove("finish-shake-wild"), 500);
      }, 5400);

      // STAGE 5: RESULTS (7.0s onwards)
      scheduleFinish(() => {
        finishVignette.classList.remove("active");
        finishSlamTitle.style.display = "none";
        finishKnifeActor.style.display = "none";
        finishHalvesStage.style.display = "none";
        finishResultsCard.classList.add("results-visible");
        playSound('fanfare');
        createFinishConfetti();
      }, 6800);
    }

    

    startAnotherBtn.addEventListener("click", () => {
      playSound('click');
      taskInput.value = '';
      showScreen("task-screen");
    });

    takeBreakBtn.addEventListener("click", () => {
      playSound('click');
      showScreen("countdown-screen");
      startCountdownSession("Break Time", selectedBreak, true);
    });

    // Start App at Intro
    window.addEventListener("DOMContentLoaded", () => {
      handleResize();
      renderAmbient();
      showScreen("intro-screen");
    });
  </script>
</body>
</html>
